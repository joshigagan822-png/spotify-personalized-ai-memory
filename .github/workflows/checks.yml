name: Class project checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run evaluate
      - run: npm test
      - run: npm run build
      - run: node --check dist/server/index.js
